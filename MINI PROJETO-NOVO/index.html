
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <nav class="menu">
    <a href="index.html">Home</a>
    <a href="pecas.html">Ver peças</a>
  </nav>

  <section class="container-form">
    <h2>Cadastro de peças</h2>
    <form id="form-cadastro">
      <input id="input-nome" type="text" placeholder="Nome da peça" required>
      <input id="input-descricao" type="text" placeholder="Descrição da peça" required>
      <input id="input-valor" type="number" placeholder="Valor da peça" required>
      <button type="submit">Adicionar peça</button>
    </form>
  </section>

  <script>
    document.getElementById('form-cadastro').addEventListener('submit', function(e) {
      e.preventDefault();

      const nome = document.getElementById('input-nome').value;
      const descricao = document.getElementById('input-descricao').value;
      const valor = document.getElementById('input-valor').value;

      const novaPeca = { nome, descricao, valor, imagem: '' };

      let lista = JSON.parse(localStorage.getItem('produtos')) || [];
      lista.push(novaPeca);
      localStorage.setItem('produtos', JSON.stringify(lista));

      alert('Peça cadastrada com sucesso!');

      // Limpa os campos do formulário para cadastrar uma nova
      document.getElementById('form-cadastro').reset();
    });
  </script>
</body>
</html>
